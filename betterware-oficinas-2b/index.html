<style>
/* Desktop BIM-authoring layout: title bar + ribbon on top, Properties and Project Browser docked left,
   tabbed model view with ViewCube, status bar at the bottom. Betterware teal carries the brand accents. */
:root{
  --bw:#299db6; --bw-d:#1d7f95; --bw-l:#dff1f6;
  --title:#2b2f33; --title-2:#3a3f45;
  --tab-strip:#e6e7e8; --ribbon:#f7f7f7; --panel-title:#e3e4e5; --rule:#cfd2d5; --rule-2:#dfe1e3;
  --dock:#f2f3f4; --dock-head:#e2e4e6; --grid-head:#dadde0; --row:#ffffff; --row-alt:#fafbfb;
  --ink:#1f2328; --ink-2:#4a5058; --muted:#767c84; --hover:#e3eef8; --hover-b:#9fc3e6;
  --sel:#1f6fe0; --ctx:#d9efd0; --ctx-ink:#24601d; --ctx-b:#9ccd8c;
  --warn-bg:#fff8db; --warn-b:#e2c35a; --danger:#c8372d;
  --f-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--title)}
body{margin:0;background:var(--dock);color:var(--ink);font:12px/1.35 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bw);outline-offset:1px}
#app{position:relative;overflow:hidden;display:grid;height:100%;
  grid-template-rows:34px 27px 96px minmax(0,1fr) 24px;grid-template-columns:minmax(0,1fr)}

/* ---------- title bar ---------- */
.titlebar{display:flex;align-items:center;gap:10px;background:var(--title);color:#e8eaec;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));min-width:0}
.titlebar .logo{height:20px;width:auto;display:block;flex:none}
.titlebar .logo-slot{display:flex;align-items:center;padding-right:10px;border-right:1px solid #4a5056;height:22px}
.qat{display:flex;align-items:center;gap:2px;flex:none}
.qb{width:26px;height:24px;border:0;background:transparent;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#dfe3e6}
.qb:hover{background:#454b52}
.qb:disabled{opacity:.35;cursor:default;background:transparent}
.qb svg{width:16px;height:16px}
.qsep{width:1px;height:16px;background:#4a5056;margin:0 4px}
.doc-title{flex:1;min-width:0;text-align:center;font-size:12.5px;color:#c9ced3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-title b{color:#fff;font-weight:600}
.tb-right{display:flex;align-items:center;gap:6px;flex:none}
.tb-chip{font-size:11.5px;color:#aab1b8;white-space:nowrap}
.tb-chip b{color:#fff;font-weight:600}
.dock-toggle{display:none}

/* ---------- ribbon ---------- */
.tabs{display:flex;align-items:flex-end;gap:1px;background:var(--tab-strip);border-bottom:1px solid var(--rule);padding:0 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;padding:4px 13px 5px;margin-bottom:-1px;cursor:pointer;color:var(--ink-2);white-space:nowrap;border-radius:2px 2px 0 0;font-size:12px}
.tab:hover{background:#f2f3f4;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ribbon);border-color:var(--rule);color:var(--ink);font-weight:600}
.tab.file{background:var(--bw);color:#fff;font-weight:600;margin-right:6px;border-radius:2px;margin-bottom:3px;padding:3px 14px}
.tab.file:hover{background:var(--bw-d)}
.tab.ctx{background:var(--ctx);color:var(--ctx-ink);border-color:var(--ctx-b)}
.tab.ctx[aria-selected="true"]{background:#eef8ea;font-weight:700}
.ribbon{background:var(--ribbon);border-bottom:1px solid var(--rule);display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;padding:0 4px;scrollbar-width:thin}
.rpanel{display:flex;flex-direction:column;border-right:1px solid var(--rule-2);flex:none}
.rpanel .rbody{flex:1;display:flex;align-items:flex-start;gap:2px;padding:4px 5px 2px}
.rpanel .rtitle{background:var(--panel-title);color:#5a6068;font-size:10.5px;text-align:center;padding:2px 8px;white-space:nowrap;border-top:1px solid var(--rule-2)}
.rpanel.ctx .rtitle{background:#e6f3e0;color:var(--ctx-ink)}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:52px;max-width:84px;padding:4px 5px 3px;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;text-align:center;line-height:1.15;color:var(--ink)}
.rb svg{width:32px;height:32px;flex:none}
.rb span{font-size:11.5px}
.rb:hover:not(:disabled){background:var(--hover);border-color:var(--hover-b)}
.rb[aria-pressed="true"]{background:#d2e5f7;border-color:#7fb0e0}
.rb:disabled{opacity:.38;cursor:default}
.rb.brand svg .acc{fill:var(--bw)}
.rb.hero{min-width:96px;max-width:112px}
.rb.hero span{font-weight:600;color:var(--bw-d)}
.rcol{display:flex;flex-direction:column;gap:1px}
.rs{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 4px;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;white-space:nowrap;font-size:11.5px;color:var(--ink);height:23px}
.rs svg{width:16px;height:16px;flex:none}
.rs:hover:not(:disabled){background:var(--hover);border-color:var(--hover-b)}
.rs[aria-pressed="true"]{background:#d2e5f7;border-color:#7fb0e0}
.rs:disabled{opacity:.38;cursor:default}
.rhint{font-size:11px;color:var(--muted);max-width:210px;padding:4px 6px;line-height:1.35;white-space:normal}

/* ---------- main area ---------- */
.main{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:0;min-width:0}
.dock{display:grid;grid-template-rows:minmax(0,1.05fr) 4px minmax(0,1fr);background:var(--dock);border-right:1px solid var(--rule);min-height:0;min-width:0}
.dpanel{display:flex;flex-direction:column;min-height:0;background:var(--dock)}
.dhead{display:flex;align-items:center;justify-content:space-between;background:var(--dock-head);border-bottom:1px solid var(--rule);padding:3px 6px 3px 8px;font-weight:600;font-size:12px;color:var(--ink);flex:none}
.dhead .x{border:0;background:transparent;width:18px;height:18px;border-radius:2px;color:var(--muted);cursor:default;display:flex;align-items:center;justify-content:center}
.splitter{background:var(--rule-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.dscroll{overflow:auto;min-height:0;flex:1}
/* properties */
.typesel{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;padding:8px;background:#fff;border-bottom:1px solid var(--rule);flex:none}
.typesel .thumb{width:44px;height:44px;border:1px solid var(--rule);background:#f4f6f7;display:flex;align-items:center;justify-content:center;border-radius:2px}
.typesel .thumb svg{width:34px;height:34px}
.typesel .tname{min-width:0}
.typesel .tname b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typesel select{width:100%;margin-top:3px;border:1px solid #b9bec4;background:#fff;border-radius:2px;padding:2px 4px;font-size:12px}
.typesel .tfixed{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfilter{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px 4px 8px;border-bottom:1px solid var(--rule);background:var(--dock);flex:none}
.pfilter span{font-size:12px}
.pfilter button{border:1px solid #b9bec4;background:#fff;border-radius:2px;padding:1px 8px;font-size:11.5px;color:var(--muted)}
.pgrid{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.pgrid th{background:var(--grid-head);text-align:left;font-weight:600;padding:3px 8px;border-bottom:1px solid var(--rule);border-top:1px solid #fff}
.pgrid td{padding:3px 8px;border-bottom:1px solid #e6e8ea;background:var(--row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid td:first-child{color:var(--ink-2);border-right:1px solid #e6e8ea;width:47%}
.pgrid td.num{font-family:var(--f-mono);font-size:11.5px}
.pgrid tr.ro td:last-child{color:var(--muted)}
.papply{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid var(--rule);background:var(--dock);flex:none}
.papply a{font-size:11.5px;color:var(--sel);text-decoration:none}
.papply button{border:1px solid #b9bec4;background:#f7f7f7;border-radius:2px;padding:2px 12px;color:var(--muted)}
/* project browser */
.tree{list-style:none;margin:0;padding:4px 0 8px}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px}
.tree li{margin:0}
.trow{display:flex;align-items:center;gap:4px;padding:1px 6px 1px 4px;cursor:pointer;white-space:nowrap;border:1px solid transparent;user-select:none;-webkit-user-select:none;min-height:21px}
.trow:hover{background:var(--hover);border-color:#cfe1f3}
.trow[aria-selected="true"]{background:#cfe6f5;border-color:#8dbbe0;font-weight:600}
.trow .tw{width:12px;height:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#6a7078}
.trow .tw svg{width:9px;height:9px;transition:transform .12s}
.trow[aria-expanded="false"] .tw svg{transform:rotate(-90deg)}
.trow .ti{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.trow .ti svg{width:15px;height:15px}
.trow.fam{cursor:grab}
.trow.fam:active{cursor:grabbing}
.trow small{color:var(--muted);font-size:11px;margin-left:2px}
.tree li[aria-hidden="true"] > ul{display:none}

/* ---------- view area ---------- */
.viewwrap{display:grid;grid-template-rows:25px minmax(0,1fr);min-width:0;min-height:0;background:#fff}
.vtabs{display:flex;align-items:flex-end;gap:2px;background:#dfe1e3;border-bottom:1px solid var(--rule);padding:0 4px;overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtab{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-bottom:0;background:#ebedee;padding:3px 6px 3px 10px;border-radius:3px 3px 0 0;cursor:pointer;white-space:nowrap;font-size:12px;color:var(--ink-2);margin-bottom:-1px}
.vtab svg{width:14px;height:14px;flex:none}
.vtab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:inset 0 2px 0 var(--bw);font-weight:600}
.vtab .cx{border:0;background:transparent;width:16px;height:16px;border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;padding:0}
.vtab .cx:hover{background:#d4d7da;color:var(--ink)}
.vtab .cx svg{width:9px;height:9px}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(180deg,#f4f7f9 0%,#ffffff 55%,#eef1f3 100%);touch-action:none}
.view.plan{background:#fff}
.view canvas{display:block;width:100%;height:100%;outline:none}
.view[data-cursor="move"] canvas{cursor:move}
.view[data-cursor="pointer"] canvas{cursor:pointer}
.view[data-cursor="draw"] canvas{cursor:crosshair}
.view[data-cursor="place"] canvas{cursor:copy}
.view[data-cursor="grab"] canvas{cursor:grab}
.view[data-cursor="grabbing"] canvas{cursor:grabbing}
.view[data-cursor="no"] canvas{cursor:not-allowed}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rlabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;color:#30363d;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;letter-spacing:.02em}
.rlabel small{display:block;text-align:center;font-weight:400;font-size:10px;color:#6b7279}
.tempdim{position:absolute;transform:translate(-50%,-140%);background:#fff;border:1px solid #2b6bd6;color:#174ea6;font:600 11px var(--f-mono);padding:1px 6px;border-radius:2px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tempdim.bad{border-color:var(--danger);color:var(--danger)}
/* ViewCube */
.vcube{position:absolute;right:18px;top:16px;width:118px;height:132px;pointer-events:none}
.vc-ring{position:absolute;left:9px;top:50px;width:100px;height:100px;border-radius:50%;border:1px solid rgba(90,100,110,.35);background:rgba(240,243,245,.55);transform:rotateX(64deg);transform-origin:50% 50%;pointer-events:none}
.vc-ring b{position:absolute;font:600 9px var(--f-ui);color:#65707a}
.vc-stage{position:absolute;left:29px;top:22px;width:60px;height:60px;perspective:340px;pointer-events:auto}
.vc{position:absolute;inset:0;transform-style:preserve-3d}
.vc .f{position:absolute;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font:600 8.5px var(--f-ui);letter-spacing:.04em;color:#3f474f;background:linear-gradient(180deg,#fbfbfc,#e7eaed);border:1px solid #9aa3ab;cursor:pointer;backface-visibility:hidden;user-select:none}
.vc .f:hover{background:#cfe3f6;color:#123e7a;border-color:#6e9fd4}
.vc-home{position:absolute;left:4px;top:2px;width:22px;height:22px;border:0;background:transparent;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#5c656e;cursor:pointer;pointer-events:auto}
.vc-home:hover{background:rgba(0,0,0,.06)}
.vc-home svg{width:15px;height:15px}
.navbar{position:absolute;right:22px;top:156px;display:flex;flex-direction:column;background:rgba(250,251,252,.92);border:1px solid #c3c8cd;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.navbar button{width:28px;height:28px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#4c545c;cursor:pointer}
.navbar button+button{border-top:1px solid #dde0e3}
.navbar button:hover{background:var(--hover)}
.navbar svg{width:16px;height:16px}
.vcbar{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:0;background:#f1f2f3;border-top:1px solid var(--rule);border-right:1px solid var(--rule);height:24px;padding:0 2px;border-radius:0 3px 0 0}
.vcbar .scale{font:11.5px var(--f-ui);color:var(--ink-2);padding:0 10px 0 8px;border-right:1px solid #d6d9dc;white-space:nowrap}
.vcbar button{width:26px;height:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#4c545c;cursor:pointer;border-radius:2px}
.vcbar button:hover{background:#dde7f0}
.vcbar button[aria-pressed="true"]{background:#d2e5f7;box-shadow:inset 0 0 0 1px #9cc0e4}
.vcbar svg{width:15px;height:15px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-2);font-size:13px;background:#fff}
.loading .bar{width:180px;height:4px;background:#e4e7ea;border-radius:2px;overflow:hidden}
.loading .bar i{display:block;height:100%;width:40%;background:var(--bw);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* warning-style notice (bottom right of the view) */
.notice{position:absolute;right:14px;bottom:36px;width:330px;max-width:calc(100% - 28px);background:var(--warn-bg);border:1px solid var(--warn-b);box-shadow:0 3px 10px rgba(0,0,0,.16);border-radius:2px;font-size:12px;z-index:5}
.notice .nh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 9px;font-weight:600;border-bottom:1px solid #ecd98e;background:#fdf0bd}
.notice .nh button{border:0;background:transparent;width:20px;height:20px;padding:0;cursor:pointer;color:#6b5d1f;display:flex;align-items:center;justify-content:center;border-radius:2px}
.notice .nh button:hover{background:rgba(0,0,0,.07)}
.notice .nh svg{width:11px;height:11px;flex:none}
.notice .nb{padding:7px 9px;color:#3d3a2c}
.notice .na{display:flex;justify-content:flex-end;gap:6px;padding:0 9px 8px}
.notice .na button{border:1px solid #c9b25a;background:#fffdf3;border-radius:2px;padding:2px 10px;cursor:pointer}
.notice.ok{background:#f1f9ee;border-color:#9ccd8c}
.notice.ok .nh{background:#dcefd4;border-color:#bcdfae}
.notice.ok .na button{border-color:#9ccd8c;background:#fff}

/* ---------- status bar ---------- */
.status{display:flex;align-items:center;gap:12px;background:#e8e9ea;border-top:1px solid var(--rule);padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));font-size:11.5px;color:var(--ink-2);min-width:0}
.status .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .sr{display:flex;align-items:center;gap:10px;white-space:nowrap}
.status .sr span{display:flex;align-items:center;gap:4px}
.status svg{width:13px;height:13px}

/* ---------- menus & dialogs ---------- */
.menu{position:fixed;z-index:60;min-width:200px;background:#fff;border:1px solid #aeb4ba;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:3px 0;font-size:12px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:5px 14px 5px 8px;text-align:left;cursor:pointer;white-space:nowrap}
.menu button svg{width:16px;height:16px;flex:none}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button:disabled{opacity:.4;cursor:default}
.menu hr{border:0;border-top:1px solid #e1e3e5;margin:3px 0}
.menu .mh{padding:4px 12px 3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(20,24,28,.28);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#f4f5f6;border:1px solid #8f979f;box-shadow:0 14px 40px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;border-radius:2px}
.dlg.wide{width:min(720px,100%)}
.dlg .dt{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #d3d7db;padding:6px 6px 6px 12px;font-size:12.5px;font-weight:600;flex:none}
.dlg .dt button{border:0;background:transparent;width:24px;height:22px;cursor:pointer;color:#555;display:flex;align-items:center;justify-content:center;border-radius:2px}
.dlg .dt button:hover{background:#e81123;color:#fff}
.dlg .dt svg{width:11px;height:11px}
.dlg .dc{padding:14px 16px;overflow:auto;min-height:0;background:#fff}
.dlg .dc h3{margin:0 0 6px;font-size:15px;color:#1b4f8a;font-weight:600}
.dlg .dc h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);border-bottom:1px solid #e3e5e7;padding-bottom:4px}
.dlg .dc p{margin:0 0 10px;color:var(--ink-2);max-width:68ch}
.dlg .da{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid #d9dcdf;flex:none;flex-wrap:wrap}
.btn{border:1px solid #adb3b9;background:#fdfdfd;border-radius:2px;padding:5px 16px;cursor:pointer;min-width:84px}
.btn:hover{background:#e8f1fa;border-color:#7fb0e0}
.btn.primary{background:var(--bw);border-color:var(--bw-d);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--bw-d)}
.dtable{width:100%;border-collapse:collapse;font-size:12px}
.dtable td{padding:4px 8px;border-bottom:1px solid #eceef0}
.dtable td:last-child{text-align:right;font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.dtable tr:last-child td{border-bottom:0}
.zlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.zlist li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.zlist li i{width:18px;height:18px;border-radius:50%;background:var(--bw-l);color:var(--bw-d);display:flex;align-items:center;justify-content:center;font:700 10px var(--f-ui);font-style:normal}
.zlist b{display:block;font-size:12.5px}
.zlist span{color:var(--ink-2)}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.steps li svg{width:15px;height:15px;flex:none}
.steps li.done{color:var(--ink)}
.steps li.done svg{color:#2f8f2f}
.prog{height:4px;background:#e4e7ea;border-radius:2px;overflow:hidden;margin:14px 0 4px}
.prog i{display:block;height:100%;width:0;background:var(--bw);transition:width .2s linear}
.foot-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.45}
.radio{display:flex;flex-direction:column;gap:6px;margin:8px 0 0}
.radio label{display:flex;align-items:center;gap:8px;cursor:pointer}
.ghost-drag{position:fixed;z-index:80;pointer-events:none;background:#fff;border:1px solid #7fb0e0;box-shadow:0 3px 10px rgba(0,0,0,.18);padding:3px 8px;font-size:11.5px;border-radius:2px;transform:translate(10px,10px)}

/* ---------- wall classification legend ---------- */
.legend{position:absolute;left:10px;bottom:34px;width:300px;max-width:calc(100% - 20px);background:rgba(255,255,255,.96);border:1px solid var(--rule);box-shadow:0 3px 10px rgba(0,0,0,.14);border-radius:2px;font-size:12px;z-index:4}
.legend .lh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 4px 9px;font-weight:600;background:#eef1f3;border-bottom:1px solid var(--rule)}
.legend .lh button{border:0;background:transparent;width:20px;height:20px;padding:0;cursor:pointer;color:#4c545c;display:flex;align-items:center;justify-content:center;border-radius:2px}
.legend .lh button:hover{background:#dde3e8}
.legend .lh svg{width:11px;height:11px;flex:none}
.legend .lr{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:8px;padding:5px 9px;border-bottom:1px solid #eef0f2;align-items:center}
.legend .lr:last-child{border-bottom:0}
.legend .lr i{width:14px;height:14px;border-radius:2px;grid-row:span 2;align-self:center}
.legend .lr b{font-weight:600;font-size:12px}
.legend .lr span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);text-align:right;white-space:nowrap}
.legend .lr em{grid-column:2 / 4;font-style:normal;font-size:11px;color:#2f7a3a}
.legend .lr.fx em{color:#6b7178}
/* ---------- proposal summary ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.kpi{border:1px solid #dfe3e6;border-radius:3px;padding:8px 9px;background:#f8fafb;min-width:0}
.kpi b{display:block;font:600 20px/1.1 var(--f-ui);color:var(--bw-d)}
.kpi span{display:block;font-size:11.5px;color:var(--ink);margin-top:2px}
.kpi em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--f-mono)}

/* ---------- narrow screens: dock becomes a drawer ---------- */
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .dock{position:absolute;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:20;box-shadow:6px 0 20px rgba(0,0,0,.2);transform:translateX(-105%);transition:transform .2s}
  .main.dock-open .dock{transform:none}
  .main{position:relative}
  .dock-toggle{display:flex}
  .tb-chip{display:none}
}
@media (max-width:620px){
  #app{grid-template-rows:34px 27px 78px minmax(0,1fr) 24px}
  .rb{min-width:46px;padding:3px}
  .rb svg{width:26px;height:26px}
  .rb span{font-size:10.5px}
  .rpanel .rtitle{display:none}
  .rhint{display:none}
  .qat .hide-s{display:none}
  .vcube{transform:scale(.8);transform-origin:100% 0;right:8px;top:8px}
  .navbar{top:118px;right:12px}
  .doc-title{text-align:left}
  .status .sr .hide-s{display:none}
  .notice{bottom:30px;right:8px}

const WALL_H = 2.7;

const cadTpl = {};
function cadTemplate(lv, cadId) {

      parts.push({ g: extrudeGeo(shp, 0.04, 0.72), mk: 'table' });
      const b = aabbPts(p.p), cx = (b[0] + b[2]) / 2, cz = (b[1] + b[3]) / 2;

    } else if (p.k === 'plant') {

function closeDockIfNarrow() { if (matchMedia('(max-width:980px)').matches) $('#main').classList.remove('dock-open'); }

/* ======================================================================= ViewCube */
const vc = $('#vc');
function syncCube() {

  vc.style.transform = `rotateX(${(-(90 * RAD - pol)) / RAD}deg) rotateY(${-az / RAD}deg)`;
  $('#vcRing').style.transform = `rotateX(64deg) rotateZ(${az / RAD}deg)`;
}
function lookFrom(face) {
  const t = ctl3.target.clone(), dist = persp.position.distanceTo(t);
  const dirs = { top: [0, 1, 0.001], front: [0, 0.25, 1], back: [0, 0.25, -1], right: [1, 0.25, 0], left: [-1, 0.25, 0], bottom: [0, 1, 0.001] };
  const d = new THREE.Vector3(...dirs[face]).normalize();
  tween(persp, ctl3, t.clone().add(d.multiplyScalar(dist)), t, true);

$$('#vc .f').forEach(f => f.addEventListener('click', () => lookFrom(f.dataset.face)));

/* ======================================================================= keyboard */
let keyBuf = '', keyT = 0;
window.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (k === 'Escape') { closeMenu(); if (dlgEl) { closeDialog(); return; } if (ui.tool !== 'modify') { if (ui.tool === 'wall' && wallStart) { wallStart = null; clearGroup(gPreview); hideDim(); status('Muro terminado. Haga clic para iniciar otro, o Esc para salir.'); requestRender(); return; } cancelTool(); return; } select(null); return; }
  if (dlgEl) return;
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  if (k === ' ') { e.preventDefault(); rotateSel(90); return; }
  if (mod) return;
  if (/^[a-zA-Z]$/.test(k)) {
    keyBuf = (keyBuf + k.toUpperCase()).slice(-2); clearTimeout(keyT); keyT = setTimeout(() => { keyBuf = ''; }, 900);
    const cmd = { WA: () => startWall('drywall'), CW: () => startWall('glass'), CM: () => startPlace(ui.placeType), MV: armMove, RO: () => rotateSel(90), CO: copySel, DE: deleteSel, ZE: () => frameView(ui.mode, true), ZF: () => frameView(ui.mode, true) }[keyBuf];
    if (cmd) { keyBuf = ''; cmd(); }
  }
});

/* ======================================================================= render loop & resize */
function resize() {
  const r = view.getBoundingClientRect(); if (!r.width || !r.height) return;

}

function loop(now) {

  if (anims.length) stepAnims(now);
  if (!needRender) return;
  needRender = false;
  renderer.render(scene, cam());
  syncCube(); placeLabels();
  const scaleTxt = ui.mode === 'plan' ? `1 : ${Math.max(10, Math.round(100 / ortho.zoom / 10) * 10)}` : '1 : 100';
  $('#vcScale').textContent = scaleTxt;
}

/* ======================================================================= chrome bindings & boot */
function bindChrome() {

  $('#q3d').onclick = () => openView(state.lv, '3d'); $('#qPlan').onclick = () => openView(state.lv, 'plan');
  $('#qFit').onclick = () => frameView(ui.mode, true); $('#nFit').onclick = () => frameView(ui.mode, true);
  $('#qHelp').onclick = helpDialog;
  $('#qDock').onclick = () => $('#main').classList.toggle('dock-open');
  $('#vcHome').onclick = () => frameView('3d', true);
  $('#vcEdges').onclick = toggleEdges; $('#vcShadow').onclick = toggleShadows; $('#vcDemo').onclick = toggleDemo; $('#vcFilter').onclick = toggleFilter;
  const zoomBy = f => {
    if (ui.mode === 'plan') { ortho.zoom = clamp(ortho.zoom * f, ctl2.minZoom, ctl2.maxZoom); ortho.updateProjectionMatrix(); ctl2.update(); }
    else { const t = ctl3.target, v = persp.position.clone().sub(t); v.multiplyScalar(1 / f); if (v.length() > ctl3.minDistance && v.length() < ctl3.maxDistance) persp.position.copy(t.clone().add(v)); ctl3.update(); }
    requestRender();
  };
  $('#nIn').onclick = () => zoomBy(1.25); $('#nOut').onclick = () => zoomBy(0.8);
}
function boot() {

  bindChrome();
  resize();
  openView('PB', '3d');

  $('#loading').hidden = true;

}
boot();
